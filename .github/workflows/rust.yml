name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Formatting and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: cargo +1.99.1 fmt --all -- --check
      - run: cargo +1.99.1 clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo +1.99.1 clippy --locked --no-default-features --all-targets -- -D warnings

  test:
    name: Rust ${{ matrix.rust }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: 1.88.0
          - os: ubuntu-latest
            rust: 1.99.1
          - os: macos-latest
            rust: 1.99.1
          - os: windows-latest
            rust: 1.99.1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo +${{ matrix.rust }} test --locked --all-targets --all-features
      - run: cargo +${{ matrix.rust }} test --locked --all-targets --no-default-features
      - run: cargo +${{ matrix.rust }} build --release --locked
      - name: Install Metal compiler
        if: runner.os == 'macOS'
        run: xcodebuild -downloadComponent metalToolchain
      - name: Compile Metal shaders
        if: runner.os == 'macOS'
        run: python3 scripts/check_shaders.py --check-format
