name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Formatting and Clippy on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: cargo +1.99.1 fmt --all -- --check
      - run: cargo +1.99.1 clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo +1.99.1 clippy --locked --no-default-features --all-targets -- -D warnings

  test:
    name: Rust ${{ matrix.rust }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: 1.88.0
          - os: ubuntu-latest
            rust: 1.99.1
          - os: macos-latest
            rust: 1.99.1
          - os: windows-latest
            rust: 1.99.1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo +${{ matrix.rust }} test --locked --all-targets --all-features
      - run: cargo +${{ matrix.rust }} test --locked --all-targets --no-default-features
      - run: cargo +${{ matrix.rust }} build --release --locked
      - name: Check Python tools and generated scenes
        if: runner.os == 'Linux' && matrix.rust == '1.99.1'
        run: |
          python3 -m compileall -q scripts
          python3 scripts/benchmark.py --help
          python3 scripts/tune_metal.py --help
          python3 scripts/check_shaders.py --help
          python3 scripts/validate_physics.py --help
          python3 scripts/benchmark.py --generate-only --spheres 2 16 64 --output target/ci-scenes
          ./target/release/rustytracer --backend cpu --scene target/ci-scenes/spheres-16.json \
            --width 16 --height 16 --samples 4 \
            --output target/ci-scenes/render.png --metrics target/ci-scenes/render.json
      - name: Verify analytical radiance through the CPU command-line renderer
        if: runner.os == 'Linux' && matrix.rust == '1.99.1'
        run: python3 scripts/validate_physics.py --cpu-only --output target/ci-physics
      - name: Install Metal compiler
        if: runner.os == 'macOS'
        run: xcodebuild -downloadComponent metalToolchain
      - name: Compile Metal shaders
        if: runner.os == 'macOS'
        run: python3 scripts/check_shaders.py --check-format
