[package]
name = "rustytracer"
version = "0.1.0"
authors = ["Ryan Glusic <glusic@uwp.edu>"]
edition = "2024"
rust-version = "1.88"
description = "A small, JSON scene-driven path tracer"
license = "MIT"
repository = "https://github.com/rglusic/rustytracer"

[dependencies]
cgmath = "0.18"
rand = "0.10.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
debug = true
