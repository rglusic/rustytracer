[package]
name = "rustytracer"
version = "0.1.0"
authors = ["Ryan Glusic <glusic@uwp.edu>"]
edition = "2024"
rust-version = "1.88"
description = "A small, JSON scene-driven path tracer"
license = "MIT"
repository = "https://github.com/rglusic/rustytracer"

[dependencies]
clap = { version = "4", features = ["derive"] }
bytemuck = { version = "1", features = ["derive"] }
cgmath = "0.18"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["metal"]
metal = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-metal"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSArray", "NSError", "NSString"] }
objc2-metal = { version = "0.3", optional = true, default-features = false, features = ["std", "objc2-core-foundation", "MTLDevice", "MTLCommandQueue", "MTLCommandBuffer", "MTLCommandEncoder", "MTLComputeCommandEncoder", "MTLComputePipeline", "MTLLibrary", "MTLBuffer", "MTLResource", "MTLTypes", "MTLAllocation", "MTLAccelerationStructure", "MTLAccelerationStructureCommandEncoder", "MTLAccelerationStructureTypes", "MTLIntersectionFunctionTable", "MTLLinkedFunctions", "MTLFunctionHandle"] }

[profile.release]
debug = true
